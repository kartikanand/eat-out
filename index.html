<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://overpass-api.de https://overpass.private.coffee https://nominatim.openstreetmap.org; base-uri 'none'; form-action 'none'"
    />
    <title>Eat Out</title>
    <meta name="description" content="Find a random place to eat around you." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8D%B4%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="css/styles.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Eat Out</h1>
        <p>Can't decide where to eat? We'll pick a random spot near you.</p>
      </header>

      <form class="controls" id="form">
        <label class="field">
          <span>Search radius</span>
          <span class="select">
            <select id="radius" name="radius">
              <option value="500">500 m</option>
              <option value="1000">1 km</option>
              <option value="1500" selected>1.5 km</option>
              <option value="3000">3 km</option>
              <option value="5000">5 km</option>
            </select>
          </span>
        </label>
        <button id="start" type="submit" class="primary">Find food near me</button>
      </form>

      <p id="status" role="status" aria-live="polite" hidden></p>

      <article id="card" hidden>
        <h2 id="name"></h2>
        <ul id="chips" class="chips"></ul>
        <ul id="details" class="details"></ul>
        <p id="links" class="links"></p>
      </article>
      <button id="again" type="button" class="secondary" hidden>Pick another</button>
    </main>
    <footer>
      Data © <a href="https://www.openstreetmap.org/copyright" rel="noopener noreferrer">OpenStreetMap contributors</a>
    </footer>
  </body>
</html>
